<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Allow the microphone</title>
    <style>
      :root {
        color-scheme: light dark;
        --ground: #e9e6dc;
        --ink: #1b1c18;
        --ink2: #4a4c44;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ground: #1c1d19;
          --ink: #eceae0;
          --ink2: #b9b8ae;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--ground);
        color: var(--ink);
        font:
          16px/1.5 system-ui,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      main {
        max-width: 26rem;
        padding: 24px 16px;
      }
      h1 {
        font-size: 1.3rem;
        margin: 0 0 8px;
      }
      p {
        color: var(--ink2);
        margin: 0 0 16px;
      }
      button {
        font: inherit;
        font-weight: 600;
        padding: 10px 18px;
        border-radius: 12px;
        border: 1.5px solid var(--ink);
        background: var(--ink);
        color: var(--ground);
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Let Foil hear you</h1>
      <p id="said">
        Chrome cannot ask for the microphone inside the side panel, so it asks
        here, once. Foil listens only while you hold Speak or Talk.
      </p>
      <button id="allow" type="button">Allow the microphone</button>
    </main>
    <script type="module" src="./mic.ts"></script>
  </body>
</html>
